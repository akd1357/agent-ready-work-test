    function buildPlainTextResult() {
      const result = state.result;
      const patternLabel = result.conditionalPattern ? t('result.conditionalPattern') : t('result.pattern');
      const pattern = patternCopy(result.pattern.code);
      const readinessConstraints = [];
      if (result.legibilityConstraint) readinessConstraints.push({ label: t('copy.legibilityConstraint'), ...constraintCopy(result.legibilityOutcome) });
      if (result.autonomyConstraint) readinessConstraints.push({ label: t('copy.autonomyConstraint'), ...constraintCopy(result.autonomyConstraint.code) });
      const nextActions = getNextActions(result.issues);
      const lines = [
        'Agent Ready Work Test',
        '',
        `${t('work.tested')}: ${state.work}`,
        `${t('work.scope')}: ${state.scope}`,
        '',
        `${t('copy.legibilityScore')}: ${result.legibility.percent} / 100`,
        `${t('copy.judgmentScore')}: ${result.judgment.percent} / 100 (${scoreLabel('J', result)})`,
        `${t('copy.reversibilityScore')}: ${result.reversibility.percent} / 100 (${scoreLabel('R', result)})`,
        '',
        `${t('copy.legibilityStatus')}: ${scoreLabel('L', result)}`,
        '',
        `${patternLabel}:`,
        pattern.title,
        pattern.description
      ];

      if (readinessConstraints.length) {
        lines.push('', `${t('copy.readiness')}:`);
        readinessConstraints.forEach(constraint => lines.push(`- ${constraint.label} — ${constraint.title}: ${constraint.description}`));
      }

      lines.push('', `${t('copy.issues')}:`);
      if (!result.issues.length) lines.push(t('result.noIssues'));
      if (result.issues.length) {
        result.issues.forEach((issue, index) => {
          const copy = issueCopy(issue.id) || issue;
          const type = issue.type === 'judgment' ? t('common.delegationConstraint') : t('common.structuralBlocker');
          lines.push(`${index + 1}. ${copy.title} — ${type} (${t(`common.severity.${issue.severity}`)})`);
          if (copy.explanation) lines.push(`   ${copy.explanation}`);
        });
      }

      if (nextActions.length) {
        lines.push('', `${t('copy.next')}:`);
        nextActions.forEach((action, index) => lines.push(`${index + 1}. ${action}`));
      }

      const boundary = boundaryCopy(result.boundarySensitivity);
      if (boundary) lines.push('', `${boundary.title}: ${boundary.text}`);

      lines.push('', `${t('copy.limitation')}: ${t('result.limits1')}`);
      return lines.join('\n');
    }

    async function copyResult() {
      const text = buildPlainTextResult();
      const status = document.getElementById('copyStatus');
      try {
        if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(text);
        status.textContent = t('result.copied');
      } catch (error) {
        copyFallbackText.value = text;
        if (typeof copyFallback.showModal === 'function') copyFallback.showModal();
        else {
          copyFallback.setAttribute('open', '');
          copyFallbackText.focus();
        }
        requestAnimationFrame(() => {
          copyFallbackText.focus();
          copyFallbackText.select();
        });
      }
    }

    document.getElementById('closeCopyFallback').addEventListener('click', () => copyFallback.close());

    function resetTest() {
      state.screen = 'start';
      state.section = 'L';
      state.work = '';
      state.scope = '';
      state.perspective = '';
      state.validationConsent = false;
      state.languageSwitchCount = 0;
      state.answers = {};
      state.result = null;
      state.focusQuestion = null;
      state.feedback = { resultFit: '', valueReaction: '', wrongOrMissing: '', submitted: false };
      state.contact = { email: '', researchConsent: false, testimonialConsent: false, submitted: false };
      resetValidationRuntime();
      render();
    }

    function answersFromVectors(L, J = [], R = [], O = []) {
      const answers = {};
      L.forEach((value, index) => { answers[`L${index + 1}`] = value; });
      J.forEach((value, index) => { answers[`J${index + 1}`] = value; });
      R.forEach((value, index) => { answers[`R${index + 1}`] = value; });
      O.forEach((value, index) => { answers[`O${index + 1}`] = value; });
      return answers;
    }

    function runSelfTests() {
      const all3 = Array(7).fill(3);
      const all0 = Array(7).fill(0);
      const test = (name, condition) => {
        if (!condition) throw new Error(`Self-test failed: ${name}`);
      };

      const A = buildResult(answersFromVectors(all3, all0, all3, [3, 3]));
      test('A legibility', A.legibilityOutcome === 'PASS');
      test('A judgment', A.effectiveJudgment === 'LOW');
      test('A reversibility', A.effectiveReversibility === 'HIGH');
      test('A pattern', A.pattern.code === 'LOW_SUPERVISION');
      test('A observability', A.observability === 'HIGH');
      test('A autonomy', A.autonomyConstraint === null);
      test('A no legibility constraint', A.legibilityConstraint === null);
      test('A pattern not conditional', A.conditionalPattern === false);

      const B = buildResult(answersFromVectors([3, 3, 0, 3, 3, 3, 3], all0, all3, [3, 3]));
      test('B outcome retained', B.legibilityOutcome === 'CLARIFY_FIRST');
      test('B diagnostic continues', B.pattern.code === 'LOW_SUPERVISION');
      test('B legibility constraint', B.legibilityConstraint !== null);
      test('B legibility issue visible', B.issues.some(item => item.id.startsWith('L')));

      const C = buildResult(answersFromVectors([3, 3, 3, 3, 3, 3, 0], all0, all3, [3, 3]));
      test('C outcome retained', C.legibilityOutcome === 'PARTIALLY_DEFINED');
      test('C diagnostic continues', C.pattern.code === 'LOW_SUPERVISION');
      test('C legibility constraint', C.legibilityConstraint !== null);
      test('C legibility issue visible', C.issues.some(item => item.id.startsWith('L')));

      const D = buildResult(answersFromVectors(all3, [0, 0, 0, 0, 0, 0, 3], all3, [3, 3]));
      test('D raw judgment', D.judgment.band === 'LOW');
      test('D J7 override', D.effectiveJudgment === 'MEDIUM');
      test('D pattern', D.pattern.code === 'CONTROLLED_COLLABORATION');

      const E = buildResult(answersFromVectors(all3, all0, [3, 3, 3, 3, 0, 3, 3], [3, 3]));
      test('E raw reversibility', E.reversibility.band === 'HIGH');
      test('E consequence cap', E.effectiveReversibility === 'MEDIUM');
      test('E pattern', E.pattern.code === 'GUARDRAILED');

      const F = buildResult(answersFromVectors(all3, all0, all3, [0, 3]));
      test('F pattern unchanged', F.pattern.code === 'LOW_SUPERVISION');
      test('F observability', F.observability === 'LOW');
      test('F autonomy', F.autonomyConstraint.code === 'VERIFICATION_REQUIRED');

      const GAnswers = answersFromVectors(all3, all0, [0, 3, 3, 3, 3, 3, 3], [3, 3]);
      test('G consistency', checkConsistency(GAnswers)?.code === 'R1_O2_CONFLICT');

      const H = buildResult(answersFromVectors(all3, all3, [3, 3, 3, 3, 1, 1, 3], [3, 3]));
      test('H judgment', H.effectiveJudgment === 'HIGH');
      test('H raw reversibility', H.reversibility.band === 'HIGH');
      test('H effective reversibility', H.effectiveReversibility === 'MEDIUM');
      test('H pattern', H.pattern.code === 'HUMAN_DECISION_OWNERSHIP');
      test('H composite', H.issues.some(item => item.title === 'Consequential actions lack a reliable control boundary'));

      const I = buildResult(answersFromVectors(all3, [1, 1, 1, 1, 1, 1, 0], all3, [3, 3]));
      test('I current pattern', I.pattern.code === 'LOW_SUPERVISION');
      test('I boundary', I.boundarySensitivity.sensitive === true && I.boundarySensitivity.dimensions.includes('JUDGMENT'));

      const JAnswers = answersFromVectors(all3, all0, [3, 3, 3, 3, 0, 3, 3], [0, 3]);
      const J = buildResult(JAnswers);
      const JCandidates = generateCandidates(JAnswers, J.effectiveJudgment, J.effectiveReversibility, J.observability);
      const JComposited = applyCompositeRules(JCandidates, JAnswers, J.effectiveReversibility, J.observability);
      test('J effective reversibility', J.effectiveReversibility === 'MEDIUM');
      test('J observability', J.observability === 'LOW');
      test('J no detection and recovery composite', !JComposited.structural.some(item => item.id === 'RO_COMPOSITE_DETECTION_RECOVERY'));

      const KAnswers = answersFromVectors(all3, all0, [1, 3, 3, 3, 3, 3, 3], [3, 3]);
      const K = buildResult(KAnswers);
      test('K perturbation creates conflict', checkConsistency({ ...KAnswers, R1: 0 })?.code === 'R1_O2_CONFLICT');
      test('K inconsistent perturbation ignored', K.boundarySensitivity.sensitive === false);

      const L = buildResult(answersFromVectors(Array(7).fill(1), all0, all3, [3, 3]));
      test('L low legibility outcome', L.legibilityOutcome === 'CLARIFY_FIRST');
      test('L diagnostic continues', L.effectiveJudgment === 'LOW' && L.effectiveReversibility === 'HIGH');
      test('L structural pattern', L.pattern.code === 'LOW_SUPERVISION');
      test('L conditional pattern', L.conditionalPattern === true);
      test('L legibility constraint', L.legibilityConstraint !== null);
      test('L no autonomy constraint', L.autonomyConstraint === null);
      test('L legibility issue visible', L.issues.some(item => item.id.startsWith('L')));

      const MAnswers = answersFromVectors(Array(7).fill(2), all3, Array(7).fill(2), [3, 3]);
      const M = buildResult(MAnswers);
      test('M partial legibility outcome', M.legibilityOutcome === 'PARTIALLY_DEFINED');
      test('M high judgment', M.effectiveJudgment === 'HIGH');
      // Preserved rc3 thresholds classify raw R=14 as HIGH; the rc4 example's MEDIUM expectation conflicts with that fixed threshold.
      test('M preserved reversibility threshold', M.reversibility.raw === 14 && M.effectiveReversibility === 'HIGH');
      test('M preserved matrix result', M.pattern.code === 'HUMAN_JUDGMENT_DELEGATED_EXECUTION');
      test('M conditional pattern', M.conditionalPattern === true);
      test('M legibility constraint', M.legibilityConstraint !== null);
      test('M legibility issue visible', M.issues.some(item => item.id.startsWith('L')));

      const MMedium = buildResult(answersFromVectors(Array(7).fill(2), all3, [2, 2, 2, 2, 2, 2, 1], [3, 3]));
      test('M medium reversibility variant', MMedium.effectiveReversibility === 'MEDIUM');
      test('M medium matrix result', MMedium.pattern.code === 'HUMAN_DECISION_OWNERSHIP');

      const sampleIssue = L.issues[0];
      const issueCard = issueMarkup(sampleIssue);
      test('N recommendation absent from issue card', !issueCard.includes(sampleIssue.recommendation) && !issueCard.includes('Recommendation:'));
      const actions = getNextActions([
        { recommendation: 'Action one.' },
        { recommendation: 'Action one.' },
        { recommendation: 'Action two.' },
        { recommendation: 'Action three.' },
        { recommendation: 'Action four.' }
      ]);
      test('N actions deduplicated', actions.filter(action => action === 'Action one.').length === 1);
      test('N maximum three actions', actions.length === 3);

      test('O feedback wording preserves LOW observability', calculateObservability({ O1: 0, O2: 3 }) === 'LOW');
      test('O feedback wording preserves MEDIUM observability', calculateObservability({ O1: 2, O2: 2 }) === 'MEDIUM');
      test('O feedback wording preserves HIGH observability', calculateObservability({ O1: 3, O2: 3 }) === 'HIGH');

      const judgmentBoundary = buildResult(answersFromVectors(all3, [1, 1, 1, 1, 1, 1, 0], all3, [3, 3])).boundarySensitivity;
      test('P Judgment boundary identifies JUDGMENT', judgmentBoundary.dimensions.includes('JUDGMENT'));

      const legibilityBoundary = buildResult(answersFromVectors([3, 3, 2, 3, 3, 3, 3], all0, all3, [3, 3])).boundarySensitivity;
      test('Q Legibility boundary identifies LEGIBILITY', legibilityBoundary.dimensions.includes('LEGIBILITY'));

      const reversibilityBoundary = buildResult(answersFromVectors(all3, all0, [2, 2, 2, 2, 2, 2, 1], [3, 3])).boundarySensitivity;
      test('R Reversibility boundary identifies REVERSIBILITY', reversibilityBoundary.dimensions.includes('REVERSIBILITY'));

      const feedbackBoundary = buildResult(answersFromVectors(all3, all0, all3, [2, 3])).boundarySensitivity;
      test('S Feedback boundary identifies FEEDBACK', feedbackBoundary.dimensions.includes('FEEDBACK'));

      const multipleBoundary = buildResult(answersFromVectors([3, 3, 2, 3, 3, 3, 3], [1, 1, 1, 1, 1, 1, 0], [2, 2, 2, 2, 2, 2, 1], [2, 3])).boundarySensitivity;
      test('T multiple boundary dimensions', multipleBoundary.sensitive && multipleBoundary.dimensions.length >= 2);

      const languageVector = answersFromVectors([3, 2, 3, 3, 2, 3, 3], [1, 2, 1, 2, 1, 2, 1], [3, 2, 3, 2, 3, 2, 3], [2, 3]);
      const signature = result => JSON.stringify({
        legibility: result.legibility,
        outcome: result.legibilityOutcome,
        judgment: result.judgment,
        effectiveJudgment: result.effectiveJudgment,
        reversibility: result.reversibility,
        effectiveReversibility: result.effectiveReversibility,
        observability: result.observability,
        pattern: result.pattern.code,
        autonomy: result.autonomyConstraint?.code || null,
        issues: result.issues.map(issue => issue.id),
        boundary: result.boundarySensitivity
      });
      const originalLanguage = state.lang;
      const languageSignatures = ['en', 'pl', 'ru'].map(lang => {
        state.lang = lang;
        return signature(buildResult(languageVector));
      });
      state.lang = originalLanguage;
      test('U identical classifications in all languages', new Set(languageSignatures).size === 1);
      test('V localization completeness', validateI18N() === true);

      test('W work title required', validateStartFields('', 'Defined scope').work === false);
      test('W scope required', validateStartFields('Defined work', '').scope === false);
      test('W both fields accepted', Object.values(validateStartFields('Defined work', 'Defined scope')).every(Boolean));

      const savedWork = state.work;
      const savedScope = state.scope;
      const savedResult = state.result;
      state.work = 'Payroll';
      state.scope = 'Approved data through payment instructions';
      state.result = A;
      const referenceMarkup = workReferenceMarkup();
      const copiedResult = buildPlainTextResult();
      test('W scope appears in result reference', referenceMarkup.includes('Approved data through payment instructions'));
      test('W work and scope appear in copied result', copiedResult.includes('Payroll') && copiedResult.includes('Approved data through payment instructions'));
      state.work = savedWork;
      state.scope = savedScope;
      state.result = savedResult;

      return true;
    }

    function runValidationSelfTests() {
      const test = (name, condition) => {
        if (!condition) throw new Error(`Validation self-test failed: ${name}`);
      };

      test('A consent false blocks SESSION', canSubmitValidationRecord('SESSION', false) === false);
      test('A consent false blocks EVENT', canSubmitValidationRecord('EVENT', false) === false);
      test('B consent true allows SESSION', canSubmitValidationRecord('SESSION', true) === true);
      test('B consent true allows EVENT', canSubmitValidationRecord('EVENT', true) === true);

      const changes = { L1: 0 };
      test('C first selection is not a change', registerAnswerSelection('L1', undefined, 2, changes) === 0 && changes.L1 === 0);
      test('D changing an answer increments once', registerAnswerSelection('L1', 2, 3, changes) === 1 && changes.L1 === 1);
      test('D selecting the same answer does not increment', registerAnswerSelection('L1', 3, 3, changes) === 1);

      const stateSnapshot = {
        ...state,
        answers: { ...state.answers },
        feedback: { ...state.feedback },
        contact: { ...state.contact }
      };
      const testLanguage = state.lang === 'en' ? 'pl' : 'en';
      state.screen = 'start';
      state.work = 'Untranslated work title';
      state.scope = 'Untranslated user scope';
      state.perspective = 'BOTH';
      state.validationConsent = true;
      render();
      setLanguage(testLanguage);
      test('E perspective survives language switching', state.perspective === 'BOTH');
      test('F work and scope survive language switching', state.work === 'Untranslated work title' && state.scope === 'Untranslated user scope');
      Object.assign(state, stateSnapshot);
      document.documentElement.lang = state.lang;

      test('G case ID removes disallowed characters', sanitizeCaseId(' PAY*ROLL-001! ') === 'PAYROLL-001');
      test('G case ID is limited to 80 characters', sanitizeCaseId('A'.repeat(100)).length === 80);
      test('G empty sanitized case ID is null', sanitizeCaseId('***') === null);

      test('H CONTACT without email is rejected', contactValidation({ email: '', researchConsent: true, testimonialConsent: false }).valid === false);
      test('I email requires at least one consent', contactValidation({ email: 'person@example.com', researchConsent: false, testimonialConsent: false }).code === 'consentRequired');

      const savedSessionId = validationRuntime.sessionId;
      validationRuntime.sessionId = 'session_validation_test';
      const unlinkedContact = contactPayload({ email: 'person@example.com', researchConsent: true, testimonialConsent: false });
      const linkedContact = contactPayload({ email: 'person@example.com', researchConsent: false, testimonialConsent: true });
      test('J no testimonial consent leaves linkage blank', unlinkedContact.feedback_session_id === '');
      test('K testimonial consent may include session ID', linkedContact.feedback_session_id === 'session_validation_test');
      validationRuntime.sessionId = savedSessionId;

      const frozen = buildResult(answersFromVectors(Array(7).fill(3), Array(7).fill(0), Array(7).fill(3), [3, 3]));
      test('L frozen vector Legibility', frozen.legibility.raw === 21 && frozen.legibilityOutcome === 'PASS');
      test('L frozen vector Judgment', frozen.judgment.raw === 0 && frozen.effectiveJudgment === 'LOW');
      test('L frozen vector Reversibility', frozen.reversibility.raw === 21 && frozen.effectiveReversibility === 'HIGH');
      test('L frozen vector result', frozen.observability === 'HIGH' && frozen.pattern.code === 'LOW_SUPERVISION' && frozen.autonomyConstraint === null);

      render();
      return true;
    }

    window.ARWT = {
      calculateLegibility,
      getLegibilityOutcome,
      calculateJudgment,
      getEffectiveJudgment,
      calculateReversibility,
      getEffectiveReversibility,
      calculateObservability,
      checkConsistency,
      getStructuralPattern,
      getAutonomyConstraint,
      getLegibilityConstraint,
      generateCandidates,
      applyCompositeRules,
      selectTopIssues,
      ensureLegibilityIssue,
      getNextActions,
      checkBoundarySensitivity,
      buildResult,
      buildPlainTextResult,
      validateI18N,
      validateStartFields,
      setLanguage,
      state,
      runSelfTests
    };

    window.ARWTValidation = {
      SCHEMA_VERSION,
      METHODOLOGY_VERSION,
      BUILD_VERSION,
      sanitizeCaseId,
      viewportClass,
      canSubmitValidationRecord,
      createValidationEnvelope,
      enqueueValidationRecord,
      eventPayload,
      registerAnswerSelection,
      buildSessionRecord,
      feedbackPayload,
      feedbackValid,
      contactValidation,
      contactPayload,
      runValidationSelfTests,
      runtime: validationRuntime
    };

    if (DEBUG) {
      validateI18N();
      runSelfTests();
    }
    render();
    if (DEBUG) runValidationSelfTests();
  </script>
</body>
</html>
