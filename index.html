<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, deterministic test of whether a unit of work is structured for delegation.">
  <title>Agent Ready Work Test</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5e6875;
      --quiet: #77818d;
      --line: #d9dee5;
      --line-strong: #bdc6d1;
      --surface: #ffffff;
      --surface-subtle: #f5f7f9;
      --surface-blue: #edf4f8;
      --accent: #174f68;
      --accent-strong: #103b50;
      --focus: #0a6e9a;
      --critical: #8d2f2f;
      --critical-bg: #fff7f6;
      --high: #8a4b10;
      --high-bg: #fff9f1;
      --medium: #65551a;
      --medium-bg: #fbfaef;
      --low: #425669;
      --low-bg: #f5f8fa;
      --shadow: 0 1px 2px rgba(18, 31, 43, .04), 0 10px 28px rgba(18, 31, 43, .055);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html { background: #eef1f4; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #eef1f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }

    button { touch-action: manipulation; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(10, 110, 154, .34);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(100% - 32px, 880px);
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px 14px;
    }

    .language-block { margin: 22px 0 26px; }

    .language-label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 720;
      color: var(--muted);
    }

    .language-selector {
      display: inline-flex;
      max-width: 100%;
      padding: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface-subtle);
    }

    .language-button {
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .language-button[aria-pressed="true"] {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 1px 2px rgba(18, 31, 43, .16);
    }

    .language-selector.compact .language-button {
      min-height: 32px;
      padding: 5px 8px;
      font-size: .78rem;
    }

    .brand {
      margin: 0;
      font-size: .9rem;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: .055em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    .progress-meta {
      min-height: 1.4rem;
      font-size: .875rem;
      color: var(--muted);
      text-align: right;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe4e9;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--accent);
      transition: width .18s ease;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 52px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 760;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { overflow-wrap: break-word; }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(2rem, 6.5vw, 3.5rem);
      line-height: 1.04;
      letter-spacing: -.045em;
      font-weight: 750;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.55rem, 4.4vw, 2.25rem);
      line-height: 1.14;
      letter-spacing: -.028em;
    }

    h3 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.35;
    }

    .lead {
      max-width: 700px;
      margin: 18px 0 0;
      font-size: 1.08rem;
      color: var(--muted);
    }

    .privacy {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin: 26px 0 30px;
      padding: 14px 16px;
      border: 1px solid #c9dbe3;
      border-radius: 11px;
      background: var(--surface-blue);
      color: #214d61;
    }

    .privacy-mark {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border: 2px solid currentColor;
      border-radius: 50%;
      text-align: center;
      font-size: .75rem;
      line-height: 16px;
      font-weight: 800;
      margin-top: 2px;
    }

    .form-group { margin-top: 4px; }

    label.input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 720;
    }

    .text-input {
      width: 100%;
      min-height: 52px;
      padding: 13px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--ink);
      background: #fff;
    }

    .text-input:hover { border-color: #8794a2; }
    .text-input[aria-invalid="true"] { border-color: var(--critical); }

    textarea.text-input {
      min-height: 96px;
      resize: vertical;
      line-height: 1.45;
    }

    .form-group + .form-group { margin-top: 20px; }

    .helper,
    .section-description,
    .question-helper,
    .muted {
      color: var(--muted);
    }

    .helper {
      margin: 7px 0 0;
      font-size: .91rem;
    }

    .error-text {
      min-height: 1.4rem;
      margin: 7px 0 0;
      color: var(--critical);
      font-size: .91rem;
      font-weight: 650;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .examples li {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #4f5b67;
      background: var(--surface-subtle);
      font-size: .84rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
    }

    .actions.split { justify-content: space-between; }

    .button {
      min-height: 46px;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-weight: 710;
      cursor: pointer;
    }

    .button-primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .button-primary:hover { background: var(--accent-strong); }

    .button-secondary {
      color: var(--ink);
      background: #fff;
      border-color: var(--line-strong);
    }

    .button-secondary:hover { background: var(--surface-subtle); }

    .button-link {
      color: var(--accent-strong);
      background: transparent;
      border-color: transparent;
      padding-inline: 4px;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .dimension-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 26px 0;
    }

    .dimension-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-subtle);
    }

    .dimension-card p { margin: 7px 0 0; color: var(--muted); font-size: .94rem; }

    .callout {
      margin: 20px 0 0;
      padding: 17px 18px;
      border-left: 4px solid var(--accent);
      background: var(--surface-blue);
    }

    .callout p { margin: 0; }
    .callout p + p { margin-top: 10px; }

    .section-header {
      margin-bottom: 26px;
      padding-bottom: 21px;
      border-bottom: 1px solid var(--line);
    }

    .section-description { margin: 9px 0 0; }

    .section-guidance {
      margin-top: 14px;
      color: var(--muted);
      font-size: .92rem;
    }

    .section-guidance p { margin: 0; }
    .section-guidance p + p { margin-top: 8px; }

    .scale-note {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-top: 16px;
      color: var(--quiet);
      font-size: .83rem;
    }

    .questions { display: grid; gap: 18px; }

    .question {
      min-width: 0;
      margin: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .question legend {
      width: 100%;
      padding: 0;
      font-size: 1rem;
      font-weight: 690;
      line-height: 1.5;
    }

    .question-code {
      display: inline-block;
      min-width: 31px;
      margin-right: 7px;
      color: var(--accent);
      font-size: .77rem;
      font-weight: 800;
      letter-spacing: .05em;
      vertical-align: .08em;
    }

    .question-helper { margin: 8px 0 0 38px; font-size: .87rem; }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 15px;
    }

    .answer-option { position: relative; min-width: 0; }

    .answer-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: .001;
    }

    .answer-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      height: 100%;
      padding: 9px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      color: #46515d;
      background: #fff;
      cursor: pointer;
      text-align: center;
      font-size: .83rem;
      line-height: 1.35;
      font-weight: 640;
      overflow-wrap: anywhere;
    }

    .answer-option label:hover { border-color: #778594; background: var(--surface-subtle); }

    .answer-option input:checked + label {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      color: var(--accent-strong);
      background: var(--surface-blue);
    }

    .answer-option input:focus-visible + label {
      outline: 3px solid rgba(10, 110, 154, .34);
      outline-offset: 2px;
    }

    .work-reference {
      margin: 0 0 24px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: .9rem;
    }

    .work-reference strong { color: var(--ink); }
    .work-reference span { display: block; }
    .work-reference span + span { margin-top: 5px; }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 26px 0 32px;
    }

    .score-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-subtle);
    }

    .score-name {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 780;
      letter-spacing: .085em;
    }

    .score-value {
      display: block;
      font-size: 1.75rem;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.035em;
      font-weight: 760;
    }

    .score-label { display: block; margin-top: 8px; color: var(--muted); font-size: .89rem; }

    .score-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .result-section {
      margin-top: 30px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .result-section > p { margin: 10px 0 0; color: var(--muted); }

    .pattern-card,
    .constraint-card {
      margin-top: 15px;
      padding: 20px;
      border: 1px solid #c8d7de;
      border-radius: 12px;
      background: var(--surface-blue);
    }

    .pattern-card p,
    .constraint-card p { margin: 8px 0 0; color: #3f5864; }

    .constraint-list { display: grid; gap: 12px; margin-top: 15px; }
    .constraint-list .constraint-card { margin-top: 0; }

    .issue-list { display: grid; gap: 12px; margin-top: 16px; }

    .issue {
      padding: 18px;
      border: 1px solid var(--line);
      border-left-width: 4px;
      border-radius: 10px;
      background: var(--surface-subtle);
    }

    .issue[data-severity="Critical"] { border-left-color: var(--critical); background: var(--critical-bg); }
    .issue[data-severity="High"] { border-left-color: var(--high); background: var(--high-bg); }
    .issue[data-severity="Medium"] { border-left-color: var(--medium); background: var(--medium-bg); }
    .issue[data-severity="Low"] { border-left-color: var(--low); background: var(--low-bg); }

    .issue-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 7px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid rgba(60, 72, 84, .2);
      border-radius: 999px;
      color: #46515d;
      background: rgba(255,255,255,.68);
      font-size: .73rem;
      line-height: 1.2;
      font-weight: 750;
    }

    .issue p { margin: 7px 0 0; color: var(--muted); font-size: .93rem; }

    .empty-issues {
      margin-top: 15px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-subtle);
    }

    .boundary {
      margin-top: 16px;
      padding: 17px 18px;
      border: 1px solid #d8cf9b;
      border-radius: 10px;
      background: #fffdf2;
    }

    .boundary p { margin: 7px 0 0; color: #635d3f; }

    .next-steps { margin-top: 30px; }
    .next-steps h2 { font-size: 1.35rem; }
    .next-steps ol { margin: 13px 0 0; padding-left: 1.35rem; }
    .next-steps li + li { margin-top: 8px; }

    .copy-status {
      min-height: 1.4rem;
      margin: 0;
      color: var(--accent-strong);
      font-size: .9rem;
      font-weight: 680;
    }

    .validation-info,
    .validation-card {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid #c9dbe3;
      border-radius: 11px;
      background: #f7fbfd;
    }

    .validation-info h2,
    .validation-card h2 { margin: 0; }

    .validation-info p,
    .validation-card > p { margin: 8px 0 0; color: var(--muted); }

    .validation-card {
      margin-top: 30px;
      border-style: dashed;
      background: var(--surface-subtle);
    }

    .validation-card h2 { font-size: 1.35rem; }

    .setup-options,
    .validation-options {
      display: grid;
      gap: 9px;
      margin-top: 11px;
    }

    .setup-option,
    .validation-option,
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .setup-option input,
    .validation-option input,
    .checkbox-row input {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--accent);
    }

    .setup-option label,
    .validation-option label,
    .checkbox-row label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .validation-question {
      margin: 22px 0 0;
      padding: 0;
      border: 0;
    }

    .validation-question legend { padding: 0; font-weight: 720; }

    .validation-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: .88rem;
    }

    .validation-status {
      min-height: 1.4rem;
      margin: 10px 0 0;
      color: var(--accent-strong);
      font-size: .9rem;
      font-weight: 650;
    }

    .sensitive-warning {
      margin: 10px 0 0;
      color: var(--critical);
      font-size: .88rem;
      font-weight: 650;
    }

    dialog {
      width: min(100% - 28px, 650px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 60px rgba(18, 31, 43, .22);
    }

    dialog::backdrop { background: rgba(19, 29, 38, .56); }

    .dialog-body { padding: 24px; }
    .dialog-body p { margin: 8px 0 14px; color: var(--muted); }

    .fallback-text {
      display: block;
      width: 100%;
      min-height: 260px;
      padding: 12px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      resize: vertical;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 700px) {
      .app-shell { width: min(100% - 20px, 880px); padding-top: 16px; }
      .panel { padding: 24px 18px; border-radius: 14px; }
      .dimension-list, .score-grid { grid-template-columns: 1fr; }
      .answer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .question { padding: 17px 14px; }
      .question-helper { margin-left: 0; }
      .actions.split { align-items: stretch; }
      .actions.split .button-primary { margin-left: auto; }
    }

    @media (max-width: 420px) {
      .topbar { align-items: flex-start; gap: 8px; }
      .brand { max-width: 145px; }
      .topbar-tools { max-width: 165px; gap: 6px; }
      .progress-meta { width: 100%; max-width: 165px; }
      .language-selector.compact .language-button { padding-inline: 7px; }
      .actions { align-items: stretch; }
      .actions .button { width: 100%; }
      .actions.split .button-primary { margin-left: 0; }
      .score-value { font-size: 1.55rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="topbar">
      <p class="brand">Agent Ready Work Test</p>
      <div class="topbar-tools">
        <div id="topLanguageSelector"></div>
        <div id="progressMeta" class="progress-meta" aria-live="polite"></div>
      </div>
    </div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <section id="app" class="panel" aria-live="polite"></section>
  </main>

  <dialog id="copyFallback" aria-labelledby="copyFallbackTitle">
    <div class="dialog-body">
      <h2 id="copyFallbackTitle"></h2>
      <p id="copyFallbackDescription"></p>
      <textarea id="copyFallbackText" class="fallback-text" readonly></textarea>
      <div class="actions">
        <button id="closeCopyFallback" class="button button-primary" type="button"></button>
      </div>
    </div>
  </dialog>

  <script>
    'use strict';

    // ARWT Algorithm v1.0-rc5.1
    const DEBUG = false;
    const SCHEMA_VERSION = 'ARWT_VALIDATION_V1';
    const METHODOLOGY_VERSION = 'ARWT Algorithm v1.0-rc5.1';
    const BUILD_VERSION = 'ARWT v1.0-rc5.1-validation.1';
    const VALIDATION_ENDPOINT = 'PASTE_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

    const QUESTIONS = {
      L: {
        title: 'Legibility',
        description: 'How independently verifiable is this work?',
        guidance: [
          'Do not answer based on whether the work feels obvious to you.',
          "Think about the last 3–5 real instances of this work. Answer based on whether another competent person could verify how the work actually operates from available examples, records, systems, artifacts or explicit rules — without relying on the current executor's memory or explanation.",
          'For planned work, answer only based on what will actually be available to the executor on day one.',
          'Choose the highest answer only if you could point to the evidence today. If unsure, choose the lower answer.'
        ],
        scale: ['Not independently verifiable', 'Mostly depends on memory or explanation', 'Mostly supported by evidence, with gaps', 'Independently verifiable from available evidence'],
        items: [
          ['L1', 'Could another competent person identify exactly what starts this work from available systems, records or rules — without asking the current executor?'],
          ['L2', 'Could another competent person determine what information, documents and context are required, and where to obtain them, without asking the current executor what is missing?'],
          ['L3', 'Can you point to a concrete example or explicit standard that shows what a correct result looks like — and how it differs from an incomplete or incorrect one?'],
          ['L4', 'Could two competent people independently review the same case and agree whether the work is complete without asking the person who performed it?'],
          ['L5', 'If the current executor became unavailable today, could another competent person reconstruct the main steps and checks from existing systems, records, examples, templates or instructions?'],
          ['L6', 'Could another competent person identify when the normal process no longer applies and what should happen next, using real examples or explicit escalation rules?'],
          ['L7', 'If this work became blocked, could another competent person identify the dependency, permission, system or decision causing the block — and who has authority to resolve it?']
        ]
      },
      J: {
        title: 'Judgment',
        description: 'How often do rules and available information fail to determine one clear action?',
        guidance: [
          'Think about the last 5–10 real instances of this work.',
          'Do not rate how difficult the decisions feel to an experienced person. Rate how often the available information and explicit rules fail to determine one clear action.',
          'Ask yourself whether another competent person, given the same formal information and rules, would reliably make the same decision.'
        ],
        scale: ['Never or almost never', 'Occasionally — isolated cases', 'Regularly — repeated across recent cases', 'In most cases'],
        items: [

          L7: { title: 'Зависимости и полномочия принимать решения недостаточно видимы', explanation: 'Важные зависимости, разрешения, блокирующие условия или владельцы решений могут быть известны только неформально.', recommendation: 'Сделайте критические зависимости, необходимые разрешения и ответственность за решения достаточно видимыми, чтобы другой компетентный человек мог определить, кто или что блокирует работу.' },
          J1: { title: 'Неоднозначная информация требует интерпретации', explanation: 'В недавних случаях неоднократно требовалось интерпретировать отсутствующую, противоречивую или неоднозначную информацию вместо применения одного явного правила.', recommendation: 'Определите, какой уровень неопределённости можно обрабатывать самостоятельно и когда нужны дополнительные сведения или эскалация.' },
          J2: { title: 'Возможны несколько обоснованных действий', explanation: 'Компетентные люди могут обоснованно выбрать разные действия на основании одинаковой информации и правил.', recommendation: 'Определите критерии выбора между приемлемыми вариантами и компромиссы, которые можно принимать самостоятельно.' },
          J3: { title: 'Решения зависят от трудно формализуемого контекста', explanation: 'Правильное действие регулярно зависит от обстоятельств, не полностью отражённых в доступных правилах или документированных критериях.', recommendation: 'Определите минимально необходимый контекст и границу, после которой решение должно оставаться за человеком.' },
          J4: { title: 'Нельзя заранее определить все исключения', explanation: 'Реальные случаи регулярно выходят за рамки стандартного процесса и требуют контекстной обработки исключений.', recommendation: 'Создайте логику эскалации вместо попытки документировать каждое возможное исключение.' },
          J5: { title: 'Работа зависит от интерпретации людей', explanation: 'Результаты регулярно зависят от интерпретации намерений, надёжности, ожиданий, тона или вероятных реакций.', recommendation: 'Отделите выполнение на основе фактов от интерпретации намерений, ожиданий или вероятных реакций.' },
          J6: { title: 'Работа зависит от неявного знания', explanation: 'Решения опираются на знания, полученные через примеры, обучение или опыт, а не на формальные сведения и правила.', recommendation: 'Сделайте критические эвристики видимыми через примеры, предупреждающие сигналы, контрпримеры и признаки хорошего или плохого решения.' },
          J7: { title: 'Ответственность за решения требует явной границы', explanation: 'Исполнитель уполномочен выбирать дальнейшее действие, когда правила не определяют один приемлемый вариант.', recommendation: 'Определите, какие решения можно принимать самостоятельно, какие можно только рекомендовать, а какие требуют разрешения человека.' },
          R1: { title: 'Ошибки могут остаться незамеченными', explanation: 'Реалистичный ошибочный результат может быть не обнаружен до возникновения существенных последующих эффектов.', recommendation: 'Добавьте проверки результата, сверку, выборочный контроль или другой механизм более раннего обнаружения ошибок.' },
          R2: { title: 'Ошибочные действия трудно отменить', explanation: 'Для реалистичного ошибочного действия может не существовать регулярно применимого пути отмены.', recommendation: 'Введите этап черновика, предварительного просмотра, подтверждения или подготовки до окончательного выполнения.' },
          R3: { title: 'Исходное состояние может быть трудно восстановить', explanation: 'Предыдущее правильное состояние может быть невозможно надёжно восстановить по записям, истории, версиям или резервным копиям.', recommendation: 'Добавьте резервное копирование, версионирование, историю транзакций или другой механизм восстановления.' },
          R4: { title: 'Исправление ошибок может быть дорогим', explanation: 'Восстановление может потребовать значительных ручных усилий, задержки, финансовых затрат или нарушения другой работы.', recommendation: 'Уменьшите масштаб возможных ошибок с помощью лимитов, поэтапного выполнения, меньших пакетов или проверок до выполнения.' },
          R5: { title: 'Ошибки могут причинить внешний вред до обнаружения', explanation: 'Реалистичная ошибка может повлиять на клиентов, сотрудников, деньги, права, обязательства или третьих лиц до её обнаружения.', recommendation: 'Ограничьте действия без надзора, способные повлиять на клиентов, деньги, права, обязательства или третьих лиц.' },
          R6: { title: 'Действия с существенными последствиями не имеют достаточного предварительного контроля', explanation: 'Такие действия могут стать окончательными без обязательной проверки, согласования или технического контроля.', recommendation: 'Добавьте явную точку проверки или согласования до окончательного выполнения действий с существенными последствиями.' },
          R7: { title: 'Последствия ошибки могут продолжать распространяться', explanation: 'Может отсутствовать определённый и применимый способ сдержать дальнейшие эффекты после обнаружения ошибки.', recommendation: 'Добавьте механизм остановки, путь отмены, правило сдерживания или обязательный путь эскалации.' },
          O1: { title: 'Качество результата трудно проверить', explanation: 'Факт выполнения может быть видим, тогда как объективная проверка правильности остаётся затруднительной.', recommendation: 'Определите наблюдаемые критерии успеха, подтверждающие не только выполнение, но и правильность.' },
          O2: { title: 'Обратная связь поступает слишком поздно или ненадёжно', explanation: 'Обратная связь может поступать недостаточно быстро или надёжно, чтобы подтвердить достижение ожидаемого результата.', recommendation: 'Добавьте более ранние проверки, сигналы мониторинга или периодическую верификацию, чтобы сократить контур обратной связи.' },
          J_COMPOSITE_HIGH_CONSEQUENCE: { title: 'Суждение с серьёзными последствиями', explanation: 'Работа сочетает значительное контекстное суждение с последствиями, которые может быть трудно исправить.', recommendation: 'Определите ответственность за решения, границы согласования и условия эскалации до повышения автономности.' },
          R_COMPOSITE_CONSEQUENTIAL: { title: 'У действий с существенными последствиями нет надёжной границы контроля', explanation: 'Работа может создавать значимые внешние последствия, а контроль до окончательного выполнения слаб.', recommendation: 'Добавьте надёжную границу согласования или контроля до того, как действия с существенными внешними последствиями станут окончательными.' },
          RO_DEDUP_FEEDBACK: { title: 'Обратная связь и обнаружение ошибок недостаточны', explanation: 'Ошибочные результаты могут оставаться незамеченными из-за слишком медленного или ненадёжного контура обратной связи.', recommendation: 'Сократите контур обратной связи и добавьте надёжный механизм более раннего обнаружения ошибочных результатов.' },
          RO_COMPOSITE_DETECTION_RECOVERY: { title: 'Ошибки может быть трудно обнаружить и исправить', explanation: 'Ошибочные результаты могут становиться заметными слишком поздно, а восстановление также может быть затруднено.', recommendation: 'До повышения автономности добавьте раннее обнаружение ошибок вместе с ясным механизмом сдерживания или восстановления.' }
        }
      }
    };

    Object.keys(I18N).forEach(lang => { I18N[lang].methodology = METHODOLOGY_I18N[lang]; });

    const SEVERITY_ORDER = { Critical: 0, High: 1, Medium: 2, Low: 3 };
    const SECTION_ORDER = ['L', 'J', 'R', 'O'];
    const ALL_IDS = SECTION_ORDER.flatMap(section => QUESTIONS[section].items.map(item => item[0]));
    const VALIDATION_RECORD_TYPES = ['SESSION', 'EVENT', 'FEEDBACK', 'CONTACT'];
    const VALIDATION_EVENT_TYPES = ['TEST_STARTED', 'LEGIBILITY_STARTED', 'LEGIBILITY_COMPLETED', 'JUDGMENT_STARTED', 'JUDGMENT_COMPLETED', 'REVERSIBILITY_STARTED', 'REVERSIBILITY_COMPLETED', 'FEEDBACK_LOOP_STARTED', 'FEEDBACK_LOOP_COMPLETED', 'RESULT_VIEWED', 'FEEDBACK_SUBMITTED', 'CONTACT_SUBMITTED'];

    const state = {
      lang: 'en',
      screen: 'start',
      section: 'L',
      work: '',
      scope: '',
      perspective: '',
      validationConsent: false,
      caseId: readCaseIdFromQuery(),
      languageSwitchCount: 0,
      feedback: { resultFit: '', valueReaction: '', wrongOrMissing: '', submitted: false },
      contact: { email: '', researchConsent: false, testimonialConsent: false, submitted: false },
      answers: {},
      result: null,
      focusQuestion: null
    };

    const validationRuntime = {
      sessionId: null,
      startedAt: null,
      completedAt: null,
      languageStart: null,
      activeSection: null,
      sectionStartedAt: null,
      totalStartedAt: null,
      totalActiveMs: 0,
      sectionMs: { L: 0, J: 0, R: 0, O: 0 },
      answerChanges: Object.fromEntries(ALL_IDS.map(id => [id, 0])),
      backCount: 0,
      consistencyReviewCount: 0,
      completed: false,
      sessionSubmitted: false,
      milestones: new Set()
    };

    const validationQueue = [];
    let validationQueueRunning = false;
    let initialRenderComplete = false;

    const app = document.getElementById('app');
    const progressMeta = document.getElementById('progressMeta');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.querySelector('.progress-track');
    const copyFallback = document.getElementById('copyFallback');
    const copyFallbackText = document.getElementById('copyFallbackText');
    const topLanguageSelector = document.getElementById('topLanguageSelector');

    function pathValue(object, path) {
      return path.split('.').reduce((value, key) => value == null ? undefined : value[key], object);
    }

    function t(key, variables = {}, lang = state.lang) {
      let value = pathValue(I18N[lang], key);
      if (value === undefined) value = pathValue(I18N.en, key);
      if (typeof value !== 'string') return value;
      return value.replace(/\{(\w+)\}/g, (match, name) => Object.hasOwn(variables, name) ? variables[name] : match);
    }

    function localizationLeafPaths(value, prefix = '', paths = []) {
      if (Array.isArray(value)) {
        value.forEach((item, index) => localizationLeafPaths(item, `${prefix}.${index}`, paths));
      } else if (value && typeof value === 'object') {
        Object.entries(value).forEach(([key, item]) => localizationLeafPaths(item, prefix ? `${prefix}.${key}` : key, paths));
      } else {
        paths.push(prefix);
      }
      return paths;
    }

    function validateI18N() {
      const required = localizationLeafPaths(I18N.en).sort();
      for (const lang of ['pl', 'ru']) {
        const available = new Set(localizationLeafPaths(I18N[lang]));
        const missing = required.filter(key => !available.has(key) || pathValue(I18N[lang], key) === undefined);
        if (missing.length) throw new Error(`Localization validation failed for ${lang}: ${missing.join(', ')}`);
      }
      return true;
    }

    function languageSelectorMarkup(compact = false) {
      const codes = ['en', 'pl', 'ru'];
      const label = compact ? t('language.compact') : t('language.selector');
      return `<div class="language-selector${compact ? ' compact' : ''}" role="group" aria-label="${escapeHtml(label)}">${codes.map(code => `
        <button class="language-button" type="button" data-lang="${code}" aria-pressed="${state.lang === code}">${escapeHtml(compact ? t(`language.short.${code}`) : t(`language.names.${code}`))}</button>`).join('')}</div>`;
    }

    function captureStartFields() {
      if (state.screen !== 'start') return;
      const workInput = document.getElementById('workDescription');
      const scopeInput = document.getElementById('workScope');
      const perspectiveInput = document.querySelector('input[name="perspective"]:checked');
      const consentInput = document.getElementById('validationConsent');
      if (workInput) state.work = workInput.value;
      if (scopeInput) state.scope = scopeInput.value;
      if (perspectiveInput) state.perspective = perspectiveInput.value;
      if (consentInput) state.validationConsent = consentInput.checked;
    }

    function captureValidationResultFields() {
      if (state.screen !== 'result') return;
      const fit = document.querySelector('input[name="resultFit"]:checked');
      const reaction = document.querySelector('input[name="valueReaction"]:checked');
      const note = document.getElementById('feedbackNote');
      const email = document.getElementById('contactEmail');
      const research = document.getElementById('researchConsent');
      const testimonial = document.getElementById('testimonialConsent');
      if (fit) state.feedback.resultFit = fit.value;
      if (reaction) state.feedback.valueReaction = reaction.value;
      if (note) state.feedback.wrongOrMissing = note.value;
      if (email) state.contact.email = email.value;
      if (research) state.contact.researchConsent = research.checked;
      if (testimonial) state.contact.testimonialConsent = testimonial.checked;
    }

    function validateStartFields(work, scope) {
      return { work: Boolean(String(work).trim()), scope: Boolean(String(scope).trim()) };
    }

    function validatePerspective(perspective = state.perspective) {
      return ['PERFORMER', 'MANAGER_OWNER', 'BOTH', 'OTHER'].includes(perspective);
    }

    function setLanguage(lang) {
      if (!['en', 'pl', 'ru'].includes(lang) || lang === state.lang) return;
      captureStartFields();
      captureValidationResultFields();
      if (initialRenderComplete) state.languageSwitchCount += 1;
      state.lang = lang;
      document.documentElement.lang = lang;
      if (state.screen === 'result') state.result = buildResult(state.answers);
      render();
    }

    function bindLanguageSelectors() {
      document.querySelectorAll('[data-lang]').forEach(button => {
        button.addEventListener('click', () => setLanguage(button.dataset.lang));
      });
    }

    function renderChrome() {
      document.documentElement.lang = state.lang;
      progressTrack.setAttribute('aria-label', t('progress.aria'));
      document.getElementById('copyFallbackTitle').textContent = t('dialog.title');
      document.getElementById('copyFallbackDescription').textContent = t('dialog.description');
      copyFallbackText.setAttribute('aria-label', t('dialog.textarea'));
      document.getElementById('closeCopyFallback').textContent = t('common.close');
      topLanguageSelector.innerHTML = state.screen === 'start' ? '' : languageSelectorMarkup(true);
    }

    function workReferenceMarkup() {
      return `<p class="work-reference"><span><strong>${escapeHtml(t('work.tested'))}:</strong> ${escapeHtml(state.work)}</span><span><strong>${escapeHtml(t('work.scope'))}:</strong> ${escapeHtml(state.scope)}</span></p>`;
    }

    function issueCopy(id) {
      return pathValue(I18N[state.lang], `methodology.issues.${id}`) || pathValue(I18N.en, `methodology.issues.${id}`);
    }

    function patternCopy(code) {
      return pathValue(I18N[state.lang], `methodology.patterns.${code}`) || pathValue(I18N.en, `methodology.patterns.${code}`);
    }

    function constraintCopy(code) {
      return pathValue(I18N[state.lang], `methodology.constraints.${code}`) || pathValue(I18N.en, `methodology.constraints.${code}`);
    }

    function boundaryCopy(boundarySensitivity) {
      if (!boundarySensitivity?.sensitive) return null;
      const key = boundarySensitivity.dimensions.length > 1 ? 'MULTIPLE' : boundarySensitivity.dimensions[0];
      return t(`boundary.${key}`);
    }

    function sanitizeCaseId(value) {
      if (value == null) return null;
      const sanitized = String(value).slice(0, 80).replace(/[^A-Za-z0-9_-]/g, '');
      return sanitized || null;
    }

    function readCaseIdFromQuery() {
      try {
        return sanitizeCaseId(new URLSearchParams(window.location?.search || '').get('case'));
      } catch (error) {
        return null;
      }
    }

    function randomId(prefix) {
      const random = globalThis.crypto;
      if (random?.randomUUID) return `${prefix}${random.randomUUID()}`;
      if (random?.getRandomValues) {
        const bytes = new Uint8Array(16);
        random.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;
        const hex = [...bytes].map(value => value.toString(16).padStart(2, '0')).join('');
        return `${prefix}${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
      }
      return `${prefix}${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`;
    }

    function viewportClass(width = window.innerWidth) {
      if (width < 600) return 'MOBILE';
      if (width < 1024) return 'TABLET';
      return 'DESKTOP';
    }

    function validationEndpointConfigured() {
      return /^https:\/\//.test(VALIDATION_ENDPOINT) && !VALIDATION_ENDPOINT.includes('PASTE_GOOGLE_APPS_SCRIPT');
    }

    function canSubmitValidationRecord(recordType, consent = state.validationConsent) {
      if (!VALIDATION_RECORD_TYPES.includes(recordType)) return false;
      return !['SESSION', 'EVENT'].includes(recordType) || consent === true;
    }

    function createValidationEnvelope(recordType, payload) {
      return { schema_version: SCHEMA_VERSION, record_type: recordType, payload };
    }

    async function transmitValidationEnvelope(envelope) {
      await fetch(VALIDATION_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(envelope),
        mode: 'no-cors',
        keepalive: true
      });
    }

    function notifyValidationFailure() {
      if (state.screen !== 'result') return;
      const status = document.getElementById('validationSendStatus');
      if (status) status.textContent = t('validation.status.sendFailed');
    }

    function enqueueValidationRecord(recordType, payload) {
      if (!canSubmitValidationRecord(recordType)) return false;
      if (!validationEndpointConfigured()) return false;
      validationQueue.push({ envelope: createValidationEnvelope(recordType, payload), attempts: 0 });
      void drainValidationQueue();
      return true;
    }

    async function drainValidationQueue() {
      if (validationQueueRunning || !validationQueue.length) return;
      validationQueueRunning = true;
      const item = validationQueue[0];
      try {
        await transmitValidationEnvelope(item.envelope);
        validationQueue.shift();
        validationQueueRunning = false;
        void drainValidationQueue();
      } catch (error) {
        item.attempts += 1;
        validationQueueRunning = false;
        if (item.attempts >= 3) {
          validationQueue.shift();
          notifyValidationFailure();
          void drainValidationQueue();
        } else {
          setTimeout(() => { void drainValidationQueue(); }, item.attempts === 1 ? 1200 : 3500);
        }
      }
    }

    function monotonicNow() {
      return typeof performance?.now === 'function' ? performance.now() : Date.now();
    }

    function activeDocument() {
      return !document.visibilityState || document.visibilityState === 'visible';
    }

    function flushActiveTiming(now = monotonicNow()) {
      if (validationRuntime.totalStartedAt != null) {
        validationRuntime.totalActiveMs += Math.max(0, now - validationRuntime.totalStartedAt);
        validationRuntime.totalStartedAt = null;
      }
      if (validationRuntime.sectionStartedAt != null && validationRuntime.activeSection) {
        validationRuntime.sectionMs[validationRuntime.activeSection] += Math.max(0, now - validationRuntime.sectionStartedAt);
        validationRuntime.sectionStartedAt = null;
      }
    }

    function resumeActiveTiming() {
      if (!validationRuntime.startedAt || validationRuntime.completed || !activeDocument()) return;
      const now = monotonicNow();
      if (validationRuntime.totalStartedAt == null) validationRuntime.totalStartedAt = now;
      if (validationRuntime.activeSection && validationRuntime.sectionStartedAt == null) validationRuntime.sectionStartedAt = now;
    }

    function setTimedSection(section) {
      if (!validationRuntime.startedAt || validationRuntime.completed) return;
      const now = monotonicNow();
      if (validationRuntime.sectionStartedAt != null && validationRuntime.activeSection) {
        validationRuntime.sectionMs[validationRuntime.activeSection] += Math.max(0, now - validationRuntime.sectionStartedAt);
      }
      validationRuntime.activeSection = section;
      validationRuntime.sectionStartedAt = section && activeDocument() ? now : null;
      if (validationRuntime.totalStartedAt == null && activeDocument()) validationRuntime.totalStartedAt = now;
    }

    function resetValidationRuntime() {
      validationRuntime.sessionId = null;
      validationRuntime.startedAt = null;
      validationRuntime.completedAt = null;
      validationRuntime.languageStart = null;
      validationRuntime.activeSection = null;
      validationRuntime.sectionStartedAt = null;
      validationRuntime.totalStartedAt = null;
      validationRuntime.totalActiveMs = 0;
      validationRuntime.sectionMs = { L: 0, J: 0, R: 0, O: 0 };
      validationRuntime.answerChanges = Object.fromEntries(ALL_IDS.map(id => [id, 0]));
      validationRuntime.backCount = 0;
      validationRuntime.consistencyReviewCount = 0;
      validationRuntime.completed = false;
      validationRuntime.sessionSubmitted = false;
      validationRuntime.milestones = new Set();
    }

    function eventPayload(eventType) {
      return {
        event_id: randomId('event_'),
        session_id: validationRuntime.sessionId,
        case_id: state.caseId,
        occurred_at: new Date().toISOString(),
        build_version: BUILD_VERSION,
        language: state.lang,
        event_type: eventType
      };
    }

    function emitMilestone(eventType) {
      if (!VALIDATION_EVENT_TYPES.includes(eventType) || validationRuntime.milestones.has(eventType)) return false;
      validationRuntime.milestones.add(eventType);
      if (!state.validationConsent || !validationRuntime.sessionId) return false;
      return enqueueValidationRecord('EVENT', eventPayload(eventType));
    }

    function beginAssessmentSession() {
      if (validationRuntime.startedAt) {
        setTimedSection('L');
        emitMilestone('LEGIBILITY_STARTED');
        return;
      }
      resetValidationRuntime();
      validationRuntime.sessionId = randomId('session_');
      validationRuntime.startedAt = new Date().toISOString();
      validationRuntime.languageStart = state.lang;
      validationRuntime.activeSection = 'L';
      resumeActiveTiming();
      emitMilestone('TEST_STARTED');

    }

    function contactValidation(contact = state.contact) {
      const email = String(contact.email || '').trim();
      if (!email) return { valid: false, code: 'emailRequired' };
      if (email.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { valid: false, code: 'emailInvalid' };
      if (!contact.researchConsent && !contact.testimonialConsent) return { valid: false, code: 'consentRequired' };

    if (typeof document.addEventListener === 'function') {
      document.addEventListener('visibilitychange', () => {
        if (!validationRuntime.startedAt || validationRuntime.completed) return;
        if (activeDocument()) resumeActiveTiming();
        else flushActiveTiming();
      });

    function sumAnswers(answers, prefix) {
      return QUESTIONS[prefix].items.reduce((total, [id]) => total + Number(answers[id]), 0);
    }

    function toPercent(raw, max) {
      return Math.round(raw / max * 100);
    }

    function calculateLegibility(answers) {
      const raw = sumAnswers(answers, 'L');
      return { raw, percent: toPercent(raw, 21) };
    }

    function getLegibilityOutcome(answers) {
      const { raw } = calculateLegibility(answers);
      if (raw <= 10 || answers.L3 === 0 || answers.L4 === 0) return 'CLARIFY_FIRST';
      if (
        raw <= 14 ||
        ['L1', 'L2', 'L5', 'L6', 'L7'].some(id => answers[id] === 0) ||
        answers.L3 === 1 ||
        answers.L4 === 1
      ) return 'PARTIALLY_DEFINED';
      return 'PASS';
    }

    function scoreBand(raw) {
      if (raw <= 6) return 'LOW';
      if (raw <= 13) return 'MEDIUM';
      return 'HIGH';
    }

    function calculateJudgment(answers) {
      const raw = sumAnswers(answers, 'J');
      return { raw, percent: toPercent(raw, 21), band: scoreBand(raw) };
    }

    function getEffectiveJudgment(answers) {
      const judgment = calculateJudgment(answers);
      return judgment.band === 'LOW' && answers.J7 === 3 ? 'MEDIUM' : judgment.band;
    }

    function calculateReversibility(answers) {
      const raw = sumAnswers(answers, 'R');
      return { raw, percent: toPercent(raw, 21), band: scoreBand(raw) };
    }

    function getEffectiveReversibility(answers) {
      const reversibility = calculateReversibility(answers);
      const consequenceCap = answers.R5 === 0 || answers.R6 === 0 || (answers.R5 <= 1 && answers.R6 <= 1);
      return consequenceCap && reversibility.band === 'HIGH' ? 'MEDIUM' : reversibility.band;
    }

    function calculateObservability(answers) {
      if (answers.O1 === 0 || answers.O2 === 0) return 'LOW';
      return answers.O1 + answers.O2 <= 4 ? 'MEDIUM' : 'HIGH';
    }

    function checkConsistency(answers) {
      if (answers.R1 === 0 && answers.O2 === 3) {
        return { code: 'R1_O2_CONFLICT', questions: ['R1', 'O2'] };
      }
      return null;
    }

    function getStructuralPattern(effectiveJudgment, effectiveReversibility) {
      return PATTERN_MATRIX[effectiveJudgment][effectiveReversibility];
    }

    function getAutonomyConstraint(observability) {
      return AUTONOMY_RULES[observability];
    }

    function getLegibilityConstraint(legibilityOutcome) {
      return LEGIBILITY_CONSTRAINTS[legibilityOutcome] || null;
    }

    function severityForStructural(value) {
      return value === 0 ? 'Critical' : value === 1 ? 'High' : value === 2 ? 'Low' : null;
    }

    function severityForJudgment(value) {
      return value === 3 ? 'High' : value === 2 ? 'Medium' : null;
    }

    function generateCandidates(answers, effectiveJudgment, effectiveReversibility, observability) {
      const structural = [];
      const judgment = [];

      Object.entries(BLOCKER_RULES).forEach(([id, rule]) => {
        const severity = severityForStructural(answers[id]);
        if (severity) structural.push({ id, type: 'structural', severity, ...rule });
      });

      Object.entries(JUDGMENT_RULES).forEach(([id, rule]) => {
        const severity = severityForJudgment(answers[id]);
        if (severity) judgment.push({ id, type: 'judgment', severity, ...rule });
      });

      if (effectiveJudgment === 'HIGH' && effectiveReversibility !== 'HIGH') {
        judgment.push({
          id: 'J_COMPOSITE_HIGH_CONSEQUENCE',
          type: 'judgment',
          composite: true,
          severity: 'High',
          priority: 6,
          title: 'High-consequence judgment',
          explanation: 'This work combines substantial contextual judgment with consequences that may be difficult to correct.',
          recommendation: 'Define decision ownership, approval boundaries and escalation conditions before increasing autonomy.'
        });
      }

      return { structural, judgment, observability };
    }

    function moreSevere(a, b) {
      return SEVERITY_ORDER[a] <= SEVERITY_ORDER[b] ? a : b;
    }

    function applyCompositeRules(candidates, answers, effectiveReversibility, observability) {
      let structural = [...candidates.structural];
      let judgment = [...candidates.judgment];
      const recoveryWeak = answers.R2 <= 1 || answers.R3 <= 1 || answers.R4 <= 1 || answers.R7 <= 1;

      if (answers.R5 <= 1 && answers.R6 <= 1) {
        structural = structural.filter(item => !['R5', 'R6'].includes(item.id));
        structural.push({
          id: 'R_COMPOSITE_CONSEQUENTIAL',
          type: 'structural',
          composite: true,
          severity: 'Critical',
          priority: 6,
          title: 'Consequential actions lack a reliable control boundary',
          explanation: 'The work can create meaningful external consequences, while the control before final execution is weak.',
          recommendation: 'Add a reliable approval or control boundary before actions with significant external consequences become final.'
        });
      }

      if (answers.R1 <= 1 && answers.O2 <= 1) {
        const severity = moreSevere(severityForStructural(answers.R1), severityForStructural(answers.O2));
        structural = structural.filter(item => !['R1', 'O2'].includes(item.id));
        structural.push({
          id: 'RO_DEDUP_FEEDBACK',
          type: 'structural',
          composite: true,
          severity,
          priority: 6,
          title: 'Feedback and error detection are insufficient',
          explanation: 'Incorrect outcomes may remain undetected because the feedback loop is too slow or unreliable.',
          recommendation: 'Shorten the feedback loop and add a reliable mechanism for detecting incorrect outcomes earlier.'
        });
      }

      if (observability === 'LOW' && recoveryWeak) {
        structural = structural.filter(item => !['R1', 'R2', 'R3', 'R4', 'R7', 'O1', 'O2', 'RO_DEDUP_FEEDBACK'].includes(item.id));
        structural.push({
          id: 'RO_COMPOSITE_DETECTION_RECOVERY',
          type: 'structural',
          composite: true,
          severity: 'Critical',
          priority: 7,
          title: 'Errors may be hard to detect and hard to recover from',
          explanation: 'Incorrect outcomes may not become visible quickly, while recovery may also be difficult.',
          recommendation: 'Add earlier error detection together with a clear containment or recovery mechanism before increasing autonomy.'
        });
      }

      const highConsequence = judgment.find(item => item.id === 'J_COMPOSITE_HIGH_CONSEQUENCE');
      if (highConsequence) judgment = [highConsequence];

      return { structural, judgment };
    }

    function sortCandidates(items) {
      return [...items].sort((a, b) => {
        const severityDifference = SEVERITY_ORDER[a.severity] - SEVERITY_ORDER[b.severity];
        if (severityDifference !== 0) return severityDifference;
        const priorityDifference = b.priority - a.priority;
        if (priorityDifference !== 0) return priorityDifference;
        return a.id.localeCompare(b.id);
      });
    }

    function selectTopIssues(candidates) {
      const structural = sortCandidates(candidates.structural);
      const judgment = sortCandidates(candidates.judgment);
      const pool = sortCandidates([...structural, ...judgment]);
      const selected = [];
      let judgmentCount = 0;

      for (const item of pool) {
        if (selected.length >= 3) break;
        if (item.type === 'judgment' && judgmentCount >= 1) continue;
        selected.push(item);
        if (item.type === 'judgment') judgmentCount += 1;
      }

      return { selected, structuralCount: structural.length, judgmentAvailable: judgment.length > 0 };
    }

    function ensureLegibilityIssue(issueSelection, candidates, legibilityOutcome) {
      if (legibilityOutcome === 'PASS' || issueSelection.selected.some(item => item.id.startsWith('L'))) {
        return issueSelection;
      }

      const highestRankedLegibilityIssue = sortCandidates(
        candidates.structural.filter(item => item.id.startsWith('L'))
      )[0];
      if (!highestRankedLegibilityIssue) return issueSelection;

      const selected = [...issueSelection.selected];
      if (selected.length >= 3) selected[selected.length - 1] = highestRankedLegibilityIssue;
      else selected.push(highestRankedLegibilityIssue);
      return { ...issueSelection, selected };
    }

    function getNextActions(issues) {
      const seen = new Set();
      const actions = [];
      for (const issue of issues) {
        const recommendation = issueCopy(issue.id)?.recommendation || issue.recommendation;
        if (!recommendation) continue;
        const action = recommendation.trim();
        const key = action.toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
        if (!action || seen.has(key)) continue;
        seen.add(key);
        actions.push(action);
        if (actions.length >= 3) break;
      }
      return actions;
    }

    function buildCoreResult(answers) {
      const legibility = calculateLegibility(answers);
      const legibilityOutcome = getLegibilityOutcome(answers);
      const judgment = calculateJudgment(answers);
      const effectiveJudgment = getEffectiveJudgment(answers);
      const reversibility = calculateReversibility(answers);
      const effectiveReversibility = getEffectiveReversibility(answers);
      const observability = calculateObservability(answers);
      const pattern = getStructuralPattern(effectiveJudgment, effectiveReversibility);
      const legibilityConstraint = getLegibilityConstraint(legibilityOutcome);
      const autonomyConstraint = getAutonomyConstraint(observability);
      const generated = generateCandidates(answers, effectiveJudgment, effectiveReversibility, observability);
      const composited = applyCompositeRules(generated, answers, effectiveReversibility, observability);
      const issueSelection = ensureLegibilityIssue(selectTopIssues(composited), composited, legibilityOutcome);

      return {
        legibility,
        legibilityOutcome,
        legibilityConstraint,
        conditionalPattern: legibilityOutcome !== 'PASS',
        judgment,
        effectiveJudgment,
        reversibility,
        effectiveReversibility,
        observability,
        pattern,
        autonomyConstraint,
        issues: issueSelection.selected,
        structuralIssueCount: issueSelection.structuralCount,
        consistency: checkConsistency(answers)
      };
    }

    function checkBoundarySensitivity(answers, original) {
      const baseline = {
        legibilityOutcome: original.legibilityOutcome,
        pattern: original.pattern ? original.pattern.code : null,
        effectiveReversibility: original.effectiveReversibility,
        autonomy: original.autonomyConstraint ? original.autonomyConstraint.code : null
      };
      const dimensions = new Set();

      ALL_IDS.forEach(id => {
        const current = answers[id];
        for (const delta of [-1, 1]) {
          const next = current + delta;
          if (next < 0 || next > 3) continue;
          const simulatedAnswers = { ...answers, [id]: next };
          // A counterfactual that would stop at consistency review is not a classifiable outcome.
          if (checkConsistency(simulatedAnswers)) continue;
          const simulated = buildCoreResult(simulatedAnswers);
          const outcome = {
            legibilityOutcome: simulated.legibilityOutcome,
            pattern: simulated.pattern ? simulated.pattern.code : null,
            effectiveReversibility: simulated.effectiveReversibility,
            autonomy: simulated.autonomyConstraint ? simulated.autonomyConstraint.code : null
          };
          if (id.startsWith('L') && outcome.legibilityOutcome !== baseline.legibilityOutcome) dimensions.add('LEGIBILITY');
          if (id.startsWith('J') && outcome.pattern !== baseline.pattern) dimensions.add('JUDGMENT');
          if (id.startsWith('R') && (outcome.pattern !== baseline.pattern || outcome.effectiveReversibility !== baseline.effectiveReversibility)) dimensions.add('REVERSIBILITY');
          if (id.startsWith('O') && outcome.autonomy !== baseline.autonomy) dimensions.add('FEEDBACK');
        }
      });

      const ordered = ['LEGIBILITY', 'JUDGMENT', 'REVERSIBILITY', 'FEEDBACK'].filter(dimension => dimensions.has(dimension));
      return { sensitive: ordered.length > 0, dimensions: ordered };
    }

    function buildResult(answers, includeBoundary = true) {
      const result = buildCoreResult(answers);
      result.boundarySensitivity = includeBoundary ? checkBoundarySensitivity(answers, result) : { sensitive: false, dimensions: [] };
      return result;
    }

        state.section = 'L';
        state.screen = 'section';
        render();
      });
    }

    function sectionComplete(section) {
      return QUESTIONS[section].items.every(([id]) => Number.isInteger(state.answers[id]));
    }

    function renderSection() {
      const section = QUESTIONS[state.section];
      const localized = t(`sections.${state.section}`);
      const sectionIndex = SECTION_ORDER.indexOf(state.section);
      const progress = [25, 48, 70, 88][sectionIndex];
      const label = state.section === 'O' ? t('progress.final') : t('progress.section', { current: sectionIndex + 1 });
      setProgress(progress, label);

      const scaleLegend = localized.scale.map((text, index) => `<span><strong>${index}</strong> = ${escapeHtml(text)}</span>`).join('');
      const guidance = (localized.guidance || []).map(text => `<p>${escapeHtml(text)}</p>`).join('');
      const questions = section.items.map(([id]) => {
        const question = localized.questions[id];
        const options = localized.scale.map((labelText, value) => {
          const inputId = `${id}-${value}`;
          const checked = state.answers[id] === value ? ' checked' : '';
          return `<div class="answer-option"><input id="${inputId}" type="radio" name="${id}" value="${value}"${checked}><label for="${inputId}">${escapeHtml(labelText)}</label></div>`;
        }).join('');
        return `
          <fieldset class="question" id="question-${id}">
            <legend><span class="question-code">${id}</span>${escapeHtml(question.text)}</legend>
            ${question.helper ? `<p class="question-helper">${escapeHtml(question.helper)}</p>` : ''}
            <div class="answer-grid">${options}</div>
          </fieldset>`;
      }).join('');

      app.innerHTML = `
        <div class="section-header">
          <p class="eyebrow">${label}</p>
          <h1>${escapeHtml(localized.title)}</h1>
          <p class="section-description">${escapeHtml(localized.description)}</p>
          ${guidance ? `<div class="section-guidance">${guidance}</div>` : ''}
          <div class="scale-note" aria-label="${escapeHtml(t('common.answerScale'))}">${scaleLegend}</div>
        </div>
        ${workReferenceMarkup()}
        <form id="questionForm">
          <div class="questions">${questions}</div>
          <div class="actions split">
            <button id="sectionBack" class="button button-secondary" type="button">${escapeHtml(t('common.back'))}</button>
            <button id="sectionNext" class="button button-primary" type="submit"${sectionComplete(state.section) ? '' : ' disabled'}>${escapeHtml(state.section === 'O' ? t('common.viewResult') : t('common.next'))}</button>
          </div>
        </form>`;

      const form = document.getElementById('questionForm');
      form.addEventListener('change', event => {
        if (event.target.matches('input[type="radio"]')) {
          const id = event.target.name;
          const nextValue = Number(event.target.value);
          registerAnswerSelection(id, state.answers[id], nextValue);
          state.answers[id] = nextValue;
          document.getElementById('sectionNext').disabled = !sectionComplete(state.section);
        }
      });
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!sectionComplete(state.section)) return;
        advanceSection();
      });
      document.getElementById('sectionBack').addEventListener('click', goBackFromSection);

      if (state.focusQuestion) {
        const target = document.getElementById(`question-${state.focusQuestion}`);
        state.focusQuestion = null;
        if (target) {
          target.setAttribute('tabindex', '-1');
          requestAnimationFrame(() => {
            target.scrollIntoView({ block: 'center' });
            target.focus();
          });
        }
      }
    }

    function advanceSection() {
      if (state.section === 'L') {
        emitMilestone('LEGIBILITY_COMPLETED');
        state.section = 'J';
        setTimedSection('J');
        emitMilestone('JUDGMENT_STARTED');
      } else if (state.section === 'J') {
        emitMilestone('JUDGMENT_COMPLETED');
        state.section = 'R';
        setTimedSection('R');
        emitMilestone('REVERSIBILITY_STARTED');
      } else if (state.section === 'R') {
        emitMilestone('REVERSIBILITY_COMPLETED');
        state.section = 'O';
        setTimedSection('O');
        emitMilestone('FEEDBACK_LOOP_STARTED');
      } else {
        emitMilestone('FEEDBACK_LOOP_COMPLETED');
        const consistency = checkConsistency(state.answers);
        if (consistency) {
          validationRuntime.consistencyReviewCount += 1;
          setTimedSection(null);
          state.screen = 'consistency';
          render();
          return;
        }
        state.result = buildResult(state.answers);
        completeAssessmentTiming();
        state.screen = 'result';
        render();
        return;
      }
      render();
    }

    function goBackFromSection() {
      validationRuntime.backCount += 1;
      const index = SECTION_ORDER.indexOf(state.section);
      if (index === 0) {
        state.screen = 'intro';
        setTimedSection(null);
      } else {
        state.section = SECTION_ORDER[index - 1];
        setTimedSection(state.section);
      }
      render();
    }

    function issueMarkup(issue) {
      const copy = issueCopy(issue.id) || issue;
      return `
        <article class="issue" data-severity="${escapeHtml(issue.severity)}">
          <div class="issue-meta">
            <span class="tag">${escapeHtml(issue.type === 'judgment' ? t('common.delegationConstraint') : t('common.structuralBlocker'))}</span>
            <span class="tag">${escapeHtml(t(`common.severity.${issue.severity}`))}</span>
          </div>
          <h3>${escapeHtml(copy.title)}</h3>
          ${copy.explanation ? `<p>${escapeHtml(copy.explanation)}</p>` : ''}
        </article>`;
    }

    function renderConsistency() {
      setProgress(92, t('progress.review'));
      app.innerHTML = `
        <p class="eyebrow">${escapeHtml(t('consistency.eyebrow'))}</p>
        <h1>${escapeHtml(t('consistency.title'))}</h1>
        <p class="lead">${escapeHtml(t('consistency.lead'))}</p>
        <p>${escapeHtml(t('consistency.prompt'))}</p>

      state.section = section;

      if (dimension === 'L') return t(`score.legibility.${result.legibilityOutcome}`);
      if (dimension === 'J') return t(`score.judgment.${result.effectiveJudgment}`);
      return t(`score.reversibility.${result.effectiveReversibility}`);

    function bindValidationCards() {
      const feedbackForm = document.getElementById('validationFeedbackForm');
      const contactForm = document.getElementById('validationContactForm');
      if (!feedbackForm || !contactForm) return;

      feedbackForm.addEventListener('change', event => {
        if (event.target.name === 'resultFit') state.feedback.resultFit = event.target.value;
        if (event.target.name === 'valueReaction') state.feedback.valueReaction = event.target.value;
      });
      document.getElementById('feedbackNote').addEventListener('input', event => { state.feedback.wrongOrMissing = event.target.value; });
      feedbackForm.addEventListener('submit', event => {
        event.preventDefault();
        if (state.feedback.submitted) return;
        captureValidationResultFields();
        const error = document.getElementById('feedbackError');
        if (!feedbackValid()) {
          error.textContent = t('validation.feedback.required');
          return;
        }
        error.textContent = '';
        const queued = enqueueValidationRecord('FEEDBACK', feedbackPayload());
        state.feedback.submitted = true;
        emitMilestone('FEEDBACK_SUBMITTED');
        feedbackForm.querySelectorAll('input, textarea, button').forEach(control => { control.disabled = true; });
        document.getElementById('feedbackStatus').textContent = queued ? t('validation.feedback.submitted') : t('validation.status.endpointMissing');
      });

      contactForm.addEventListener('change', () => captureValidationResultFields());
      document.getElementById('contactEmail').addEventListener('input', event => { state.contact.email = event.target.value; });
      contactForm.addEventListener('submit', event => {
        event.preventDefault();
        if (state.contact.submitted) return;
        captureValidationResultFields();
        const validation = contactValidation();
        const error = document.getElementById('contactError');
        if (!validation.valid) {
          error.textContent = t(`validation.contact.${validation.code}`);
          return;
        }
        error.textContent = '';
        const queued = enqueueValidationRecord('CONTACT', contactPayload());
        state.contact.submitted = true;
        emitMilestone('CONTACT_SUBMITTED');
        contactForm.querySelectorAll('input, button').forEach(control => { control.disabled = true; });
        document.getElementById('contactStatus').textContent = queued ? t('validation.contact.saved') : t('validation.status.endpointMissing');
      });
    }

    function renderFullResult() {
      const result = state.result;
      setProgress(100, t('progress.complete'));
      const judgmentOverrideNote = result.judgment.band === 'LOW' && result.effectiveJudgment === 'MEDIUM'
        ? `<p class="score-note"><strong>${escapeHtml(t('score.judgmentOverride'))}</strong></p>`

          <article class="score-card"><span class="score-name">${escapeHtml(t('score.J'))}</span><strong class="score-value">${result.judgment.percent} / 100</strong><span class="score-label">${escapeHtml(scoreLabel('J', result))}</span>${judgmentOverrideNote}</article>
